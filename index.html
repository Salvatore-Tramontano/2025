    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #0A0A0A;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, .font-display { font-family: 'Space Grotesk', sans-serif; }
        .font-signature { font-family: 'Dancing Script', cursive; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        /* Spotlight Card */
        .spotlight-card {
            position: relative;
            overflow: hidden;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            transition: border-color 0.4s;
        }
        
        /* FIX MOBILE: L'animazione di movimento si attiva solo se il dispositivo ha un puntatore (mouse) */
        @media (hover: hover) {
            .spotlight-card {
                transition: transform 0.4s ease-out, border-color 0.4s;
            }
            .spotlight-card:hover { 
                transform: translateY(-4px);
                border-color: rgba(255,255,255,0.3);
                z-index: 30;
                box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
            }
        }

        @media (hover: none) {
            .spotlight-card:active {
                border-color: rgba(255,255,255,0.3);
            }
        }
        
        .spotlight-card::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(
                800px circle at var(--mouse-x, 50% 50%) var(--mouse-y, 50% 50%), 
                rgba(255, 255, 255, 0.1), 
                transparent 40%
            );
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            z-index: 20;
        }

        .spotlight-card:hover::after { opacity: 1; }

        /* Immagini sempre a colori e visibili */
        .card-image-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            z-index: 1;
            transition: all 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            filter: grayscale(0%) brightness(0.6); 
            transform: scale(1.0);
        }
        
        .spotlight-card:hover .card-image-bg {
            filter: brightness(0.8); 
            transform: scale(1.05);
        }

        .card-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.8) 40%, rgba(0,0,0,0.3) 100%);
            z-index: 2;
        }

        /* Tooltip Custom Classes */
        .chart-tooltip {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 50;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .chart-tooltip.top { bottom: 100%; margin-bottom: 8px; }
        .chart-tooltip.bottom { top: 100%; margin-top: 8px; }
        
        .group:hover .chart-tooltip { opacity: 1; }

        /* Ambient Noise & Mesh */
        .ambient-mesh {
            position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background-image: 
                radial-gradient(at 0% 0%, rgba(120, 119, 198, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(74, 222, 128, 0.05) 0px, transparent 50%);
        }
        .noise {
            position: fixed; inset: 0; z-index: 50; opacity: 0.04; pointer-events: none;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

            { title: "Angoli di avvicinamento", author: "Sally Rooney", source: "The NY Review of Books", url: "https://archive.ph/j6rkl", cat: "article" },
            { title: "La partita più tesa della storia", author: "Daniele Manusia", source: "Ultimo Uomo", url: "https://ultimouomo.com/video-youtube-partita-piu-testa-della-storia", cat: "article" },
            { title: "Scivolava meglio Nesta o Cannavaro?", author: "Daniele Manusia", source: "Ultimo Uomo", url: "https://ultimouomo.com/alessandro-nesta-fabio-cannavaro-scivolate", cat: "article" },
            
            { title: "Tintoria #265 Monir Ghassem", author: "YouTube", source: "YouTube", url: "https://www.youtube.com/watch?v=audq8YDfX_Y", cat: "podcast", hideSubtitle: true },
            { title: "Fuoriclasse del racconto sportivo", author: "Buffa e Roggero", source: "YouTube", url: "https://www.youtube.com/watch?v=sO4PTO86otI", cat: "podcast" },
            { title: "Il Banchiere di Dio", author: "Nicolò Majnoni", source: "Spotify", url: "https://open.spotify.com/show/4MC8oK3Zd5h3gYRGd5blok", cat: "podcast" },
            
            { title: "Milano - Sanremo (2025)", author: "RaiPlay", source: "Rai", url: "https://www.raiplay.it/video/2025/03/-Milano-Sanremo-2025-la-sintesi---22-03-2025-4d2485d4-2730-4722-81d7-56a9f61f41de.html", cat: "sport", hideSubtitle: true },
            { title: "Tour de France 2025 - 17a tappa", author: "RaiPlay", source: "Rai", url: "https://www.raiplay.it/video/2025/07/Ciclismo-Tour-de-France-2025---17a-tappa--Bollene---Valence-gli-Highlights---23-07-2025-9eb9768f-ad98-4f7e-9757-b5a3475d7435.html", cat: "sport", hideSubtitle: true },
        ];

        // --- COMPONENTS ---

        const CountUp = ({ to, suffix = "" }) => {
            const [val, setVal] = useState(0);
            const ref = useRef(null);
            const isInView = useInView(ref, { once: true });

            useEffect(() => {
                if (isInView) {
                    let start = 0;
                    const duration = 2000;
                    const startTime = performance.now();
                    const animate = (t) => {
                        const progress = Math.min((t - startTime) / duration, 1);
                        const ease = 1 - Math.pow(1 - progress, 3);
                        setVal(Math.floor(to * ease));
                        if (progress < 1) requestAnimationFrame(animate);
                    };
                    requestAnimationFrame(animate);
                }
            }, [isInView, to]);

            return <span ref={ref}>{val}{suffix}</span>;
        };

        const DonutChart = ({ value, absValue, colorClass, textClass, label, sub }) => {
            if (value === null) return null;
            const r = 30;
            const c = 2 * Math.PI * r;
            const offset = c - (value / 100) * c;
            
            return (
                <div className="flex flex-col items-center justify-between h-full group cursor-pointer relative">
                    <div className="w-full text-left mb-2">
                        <p className="text-white text-[10px] uppercase tracking-widest font-bold">
                            <span className={textClass}>{label}</span> vs {sub.replace('vs ', '')}
                        </p>
                    </div>

                    <div className="relative w-32 h-32 my-auto">
                        <svg className="w-full h-full -rotate-90" viewBox="0 0 80 80">
                            <circle cx="40" cy="40" r={r} stroke="#1A1A1A" strokeWidth="8" fill="none" />
                            <motion.circle 
                                cx="40" cy="40" r={r} 
                                className={colorClass} strokeWidth="8" fill="none"
                                strokeDasharray={c}
                                initial={{ strokeDashoffset: c }}
                                whileInView={{ strokeDashoffset: offset }}
                                viewport={{ once: true }}
                                transition={{ duration: 1.5, ease: "easeOut" }}
                                strokeLinecap="round"
                            />
                        </svg>
                        <div className="absolute inset-0 flex flex-col items-center justify-center">
                            <span className="text-2xl font-bold font-display">{absValue}</span>
                            <span className="text-[10px] text-neutral-500 uppercase">{label}</span>
                        </div>
                        
                        <div className="chart-tooltip bottom">
                            {label}: {absValue} ({value}%)
                        </div>
                    </div>
                </div>
            );
        };

        const HistoricalChart = ({ data, bgClass }) => {
            const max = Math.max(...data.map(d => d.v)) * 1.2 || 1;
            return (
                <div className="h-40 flex items-end justify-between gap-2 w-full mt-4 pb-6">
                    {data.map((d, i) => (
                        <div key={i} className="flex-1 flex flex-col items-center justify-end h-full group relative">
                            <span className="text-[10px] text-white/70 mb-1 font-mono">{d.v}</span>
                            <div className="chart-tooltip top">
                                {d.y}: {d.v}
                            </div>
                            <motion.div 
                                initial={{ height: 0 }}
                                whileInView={{ height: `${(d.v / max) * 100}%` }}
                                viewport={{ once: true }}
                                transition={{ duration: 0.8, delay: i * 0.1 }}
                                className={`w-full ${bgClass} rounded-t-sm opacity-60 group-hover:opacity-100 transition-opacity min-h-[4px]`}
                            />
                            <span className="mt-2 text-[10px] text-neutral-500 font-mono rotate-0 whitespace-nowrap">{d.y}</span>
                        </div>
                    ))}
                </div>
            );
        };

        const MonthlyChart = ({ data, bgClass, heightClass = "h-40" }) => {
            const max = Math.max(...data) * 1.1 || 1;
            const shortMonths = ["G","F","M","A","M","G","L","A","S","O","N","D"];
            const fullMonths = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
            
            return (
                <div className={`${heightClass} flex items-end justify-between gap-1 w-full mt-auto pb-4`}>
                    {data.map((v, i) => (
                        <div key={i} className="flex-1 flex flex-col items-center justify-end h-full group relative">
                             <span className="text-[9px] text-white/50 mb-1 font-mono">{v > 0 ? v : ''}</span>
                            <div className="chart-tooltip top">
                                {fullMonths[i]}: {v}
                            </div>
                            <motion.div 
                                initial={{ height: 0 }}
                                whileInView={{ height: `${(v / max) * 100}%` }}
                                viewport={{ once: true }}
                                transition={{ duration: 0.5, delay: 0.2 + (i*0.05) }}
                                className={`w-full ${bgClass} rounded-t-sm opacity-40 group-hover:opacity-90 transition-opacity min-h-[2px]`}
                            />
                            <span className="mt-2 text-[9px] text-neutral-600 font-mono">{shortMonths[i]}</span>
                        </div>
                    ))}
                </div>
            );
        };

        const SpotlightCard = ({ children, img, className = "", isLarge = false, noImage = false, url = "" }) => {
            const ref = useRef(null);
            
            const handleMouseMove = (e) => {
                if(!ref.current) return;
                const rect = ref.current.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                ref.current.style.setProperty('--mouse-x', `${x}px`);
                ref.current.style.setProperty('--mouse-y', `${y}px`);
            };

            const CardContent = (
                <motion.div 
                    ref={ref}
                    onMouseMove={handleMouseMove}
                    initial={{ opacity: 0, y: 30 }}
                    whileInView={{ opacity: 1, y: 0 }}
                    viewport={{ once: true, margin: "-50px" }}
                    transition={{ duration: 0.5 }}
                    className={`spotlight-card rounded-xl flex flex-col justify-end p-8 group 
                        ${noImage ? 'min-h-[200px] justify-between' : 'h-[450px]'} 
                        ${isLarge ? 'md:col-span-2 min-h-[550px]' : 'col-span-1'} 
                        ${className}`}
                >
                    {!noImage && (
                        <>
                            <div className="card-image-bg" style={{ backgroundImage: `url(${img})` }}></div>
                            <div className="card-gradient"></div>
                        </>
                    )}
                    
                    {/* MODIFICATO: z-30 per stare sopra l'effetto luce (z-20) e garantire click sui link */}
                    <div className="relative z-30 w-full h-full flex flex-col">
                        {children}
                    </div>
                </motion.div>
            );

            return CardContent; 
        };

        const DashboardCard = ({ data }) => {
            const hasPie = data.stats.pieVal !== null;
            
            return (
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 bg-[#0E0E0E] border border-white/10 rounded-3xl p-8 mb-16 relative">
                    <div className="absolute inset-0 overflow-hidden rounded-3xl pointer-events-none">
                        <div className={`absolute -top-24 -right-24 w-96 h-96 bg-gradient-to-br ${data.bgClass.replace('bg-', 'from-')}/20 to-transparent blur-3xl rounded-full`}></div>
                    </div>

                    <div className="lg:col-span-7 flex flex-col justify-between lg:pr-8 lg:border-r border-white/10 relative z-10">
                        <div className="mb-8">
                            <p className="text-neutral-500 text-xs uppercase tracking-widest mb-1">Totale 2025</p>
                            <div className="flex items-baseline gap-4">
                                <span className="text-7xl font-display font-bold text-white tracking-tighter">
                                    <CountUp to={data.stats.total} />
                                </span>
                                <div className={`flex items-center gap-1 px-2 py-1 rounded-full bg-white/5 border border-white/10 text-sm ${data.stats.yoyDir === 'up' ? 'text-green-400' : 'text-red-400'}`}>
                                    {data.stats.yoyDir === 'up' ? <Icons.Up /> : <Icons.Down />}
                                    <span>{data.stats.yoy}</span>
                                </div>
                            </div>
                        </div>
                        <div>
                            <p className="text-neutral-500 text-[10px] uppercase tracking-widest mb-2">Trend Storico (2020-2025)</p>
                            <HistoricalChart data={data.stats.history} bgClass={data.bgClass} />
                        </div>
                    </div>

                    <div className="lg:col-span-5 flex flex-col justify-between lg:pl-8 pt-8 lg:pt-0 h-full relative z-10">
                        {hasPie ? (
                            <>
                                <div className="h-48 mb-4">
                                    <DonutChart 
                                        value={data.stats.pieVal} 
                                        absValue={data.stats.pieAbs}
                                        colorClass={data.strokeClass} 
                                        textClass={data.textClass}
                                        label={data.stats.pieLabel} 
                                        sub={data.stats.pieSub} 
                                    />
                                </div>
                                <div className="mt-auto">
                                     <p className="text-neutral-500 text-[10px] uppercase tracking-widest mb-2 text-left">Attività Mensile</p>
                                     <MonthlyChart data={data.monthly} bgClass={data.bgClass} />
                                </div>
                            </>
                        ) : (
                            <div className="h-full flex flex-col">
                                <p className="text-neutral-500 text-[10px] uppercase tracking-widest mb-4 text-left">Attività Mensile</p>
                                <div className="flex-1 w-full">
                                    <MonthlyChart data={data.monthly} bgClass={data.bgClass} heightClass="h-full min-h-[200px]" />
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const TopList = ({ data }) => {
            const list = [...data.topList]; 
            const isMovies = data.id === 'movies';
            const isSeries = data.id === 'series';
            const isBooks = data.id === 'books';

            return (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    {list.map((item, index) => {
                        let isTop = false;
                        if (isMovies) isTop = item.rank <= 3;
                        else if (isSeries) isTop = item.rank <= 3; 
                        else if (isBooks) isTop = item.rank <= 3;

                        return (
                            <SpotlightCard key={item.rank} img={item.img} isLarge={isTop}>
                                <div className="flex justify-between items-start mb-4">
                                    <span className={`font-display font-bold ${data.color} ${isTop ? 'text-7xl' : 'text-5xl'} drop-shadow-lg`}>
                                        #{item.rank}
                                    </span>
                                    {/* Icona Link Esterno: Aggiunto z-20 e relative per sicurezza click */}
                                    {item.url && (
                                        <a href={item.url} target="_blank" className="relative z-20 p-2 bg-black/40 backdrop-blur rounded-full text-white/50 hover:text-white hover:bg-white/20 transition-all">
                                            {isMovies ? <Icons.External /> : isSeries ? <Icons.External /> : <Icons.External />}
                                        </a>
                                    )}
                                </div>
                                <div className="mt-auto">
                                    <h4 className={`font-bold text-white leading-none mb-2 drop-shadow-md ${isTop ? 'text-4xl' : 'text-2xl'}`}>
                                        {item.title}
                                    </h4>
                                    
                                    <div className="flex flex-col gap-1">
                                        {isMovies && item.director && (
                                            <p className="text-xs text-white/80 font-bold uppercase tracking-wider drop-shadow-sm">
                                                {item.director}
                                            </p>
                                        )}
                                        
                                        {!isSeries && (
                                            <p className="text-sm text-neutral-300 font-medium drop-shadow-sm opacity-80">
                                                {item.auth}
                                            </p>
                                        )}
                                    </div>

                                    {!isMovies && !isSeries && item.desc && (
                                        <>
                                            <p className={`text-neutral-200 leading-relaxed drop-shadow-sm my-4 ${isTop ? 'text-lg opacity-90' : 'text-sm opacity-0 group-hover:opacity-100 transition-opacity line-clamp-3'}`}>
                                                "{item.desc}"
                                            </p>
                                            <div className="flex flex-wrap gap-2">
                                                {item.tags.map(t => (
                                                    <span key={t} className="px-2 py-1 text-[9px] uppercase tracking-wider bg-black/50 border border-white/10 backdrop-blur rounded text-white">
                                                        {t}
                                                    </span>
                                                ))}
                                            </div>
                                        </>
                                    )}
                                </div>
                            </SpotlightCard>
                        );
                    })}
                </div>
            );
        };

        const MusicSection = () => {
            return (
                <section className="py-24 px-6 md:px-12 max-w-[1400px] mx-auto border-t border-white/5">
                    <div className="flex items-center gap-6 mb-12">
                        <div className="p-4 rounded-2xl bg-white/5 border border-white/10 text-rose-500">
                            <Icons.Music />
                        </div>
                        <div>
                            <h2 className="text-4xl md:text-5xl font-display font-bold tracking-tight mb-2">Musica</h2>
                            <p className="text-neutral-400">I 5 album dell'anno.</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-1 gap-4 max-w-3xl mx-auto">
                        {MUSIC_DATA.map((track) => (
                            <motion.div 
                                key={track.rank}
                                initial={{ opacity: 0, x: -20 }}
                                whileInView={{ opacity: 1, x: 0 }}
                                transition={{ delay: track.rank * 0.1 }}
                                className="flex items-center gap-6 p-6 rounded-xl border border-white/5 bg-white/[0.02] hover:bg-white/[0.05] transition-colors group"
                            >
                                <span className="text-4xl font-display font-bold text-neutral-700 group-hover:text-rose-500 transition-colors">#{track.rank}</span>
                                <div className="flex-1">
                                    <h3 className="text-xl font-bold text-white mb-1">{track.title}</h3>
                                    <p className="text-sm text-rose-400 uppercase tracking-widest">{track.artist}</p>
                                </div>
                                <div className="flex items-center gap-4">
                                    {track.url && (
                                        <a href={track.url} target="_blank" className="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center hover:bg-[#1DB954] hover:text-black transition-all">
                                            <Icons.External />
                                        </a>
                                    )}
                                </div>
                            </motion.div>
                        ))}
                    </div>
                </section>
            );
        };

        const LinksSection = () => {
            const sortedLinks = [...ARTICLES_DATA].sort((a, b) => {
                const order = { 'article': 1, 'podcast': 2, 'sport': 3 };
                return order[a.cat] - order[b.cat];
            });

            const getCatColor = (cat) => {
                switch(cat) {
                    case 'article': return 'text-emerald-400 border-emerald-500/20 bg-emerald-500/10';
                    case 'podcast': return 'text-purple-400 border-purple-500/20 bg-purple-500/10';
                    case 'sport': return 'text-orange-400 border-orange-500/20 bg-orange-500/10';
                    default: return 'text-white border-white/20 bg-white/10';
                }
            };

            return (
                <section className="py-24 px-6 md:px-12 max-w-[1400px] mx-auto border-t border-white/5 bg-gradient-to-b from-transparent to-[#0A0A0A]">
                    <div className="flex items-center gap-6 mb-12">
                        <div className="p-4 rounded-2xl bg-white/5 border border-white/10 text-emerald-500">
                            <Icons.Link />
                        </div>
                        <div>
                            <h2 className="text-4xl md:text-5xl font-display font-bold tracking-tight mb-2">Altre cose che mi sono piaciute</h2>
                            <p className="text-neutral-400 text-lg">
                                <span className="text-emerald-400 font-medium">Articoli</span>, 
                                <span className="text-purple-400 font-medium mx-1">Podcast</span>, 
                                <span className="text-orange-400 font-medium">Sport</span>.
                            </p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {sortedLinks.map((item, i) => (
                            <SpotlightCard key={i} noImage className={`hover:border-opacity-50 h-full transition-colors ${
                                item.cat === 'article' ? 'hover:border-emerald-500' : 
                                item.cat === 'podcast' ? 'hover:border-purple-500' : 
                                'hover:border-orange-500'
                            }`}>
                                <div className="flex justify-between items-start mb-6">
                                    <span className={`px-2 py-1 rounded text-[10px] font-bold uppercase tracking-wider border ${getCatColor(item.cat)}`}>
                                        {item.source}
                                    </span>
                                    <a 
                                        href={item.url} 
                                        target="_blank" 
                                        className="relative z-30 p-2 -m-2 text-neutral-500 group-hover:text-white transition-colors"
                                    >
                                        <Icons.External />
                                    </a>
                                </div>
                                <div>
                                    <h3 className={`text-xl font-bold text-white mb-2 leading-tight transition-colors ${
                                        item.cat === 'article' ? 'group-hover:text-emerald-400' : 
                                        item.cat === 'podcast' ? 'group-hover:text-purple-400' : 
                                        'group-hover:text-orange-400'
                                    }`}>
                                        {item.title}
                                    </h3>
                                    {!item.hideSubtitle && (
                                        <p className="text-sm text-neutral-400 italic">
                                            {!item.hideDi && "di "} {item.author}
                                        </p>
                                    )}
                                </div>
                            </SpotlightCard>
                        ))}
                    </div>
                </section>
            );
        };

        const Section = ({ data }) => {
            const Icon = Icons[data.icon];
            return (
                <section className="py-24 px-6 md:px-12 max-w-[1400px] mx-auto border-t border-white/5">
                    {/* Header */}
                    <div className="flex items-center gap-6 mb-12">
                        <div className={`p-4 rounded-2xl bg-white/5 border border-white/10 ${data.color}`}>
                            <Icon />
                        </div>
                        <div>
                            <h2 className="text-4xl md:text-5xl font-display font-bold tracking-tight mb-2">{data.title}</h2>
                        </div>
                    </div>

                    {/* Stats Dashboard */}
                    <DashboardCard data={data} />

                    {/* Countdown Divider */}
                    <div className="flex items-center gap-6 mb-12">
                        <h3 className="text-2xl font-display font-bold text-white">Top {data.topList.length}</h3>
                        <div className="h-[1px] flex-1 bg-gradient-to-r from-white/20 to-transparent"></div>
                    </div>

                    {/* List */}
                    <TopList data={data} />
                </section>
            );
        };

        const Hero = () => {
             return (
                <section className="min-h-screen flex flex-col justify-center items-center text-center relative px-6 overflow-hidden">
                    {/* Hero Background Effect */}
                    <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-neutral-900/40 via-black to-black pointer-events-none"></div>
                    
                    <motion.div 
                        initial={{ opacity: 0, scale: 0.8, filter: "blur(20px)" }} 
                        animate={{ opacity: 1, scale: 1, filter: "blur(0px)" }} 
                        transition={{ duration: 1.5, ease: "easeOut" }}
                        className="relative z-10 py-4 w-full flex justify-center"
                    >
                        {/* Adjusted tracking and leading */}
                        <h1 className="text-[25vw] leading-none font-bold font-display tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-purple-500 via-cyan-500 to-orange-500 drop-shadow-2xl px-4 select-none">
                            2025
                        </h1>
                    </motion.div>

                    <motion.div 
                        initial={{ opacity: 0 }} 
                        animate={{ opacity: 1 }} 
                        transition={{ delay: 1.5, duration: 1 }}
                        className="absolute bottom-12 left-1/2 -translate-x-1/2"
                    >
                        <div className="flex flex-col items-center gap-2">
                            <div className="w-[1px] h-16 bg-gradient-to-b from-neutral-500/50 to-transparent"></div>
                        </div>
                    </motion.div>
                </section>
            );
        };

        const Footer = () => {
            return (
                <footer className="min-h-screen flex flex-col justify-center items-center py-32 px-6 border-t border-white/5 relative overflow-hidden">
                    <div className="max-w-4xl mx-auto text-center relative z-10">
                        <motion.div
                            initial={{ opacity: 0, y: 30 }}
                            whileInView={{ opacity: 1, y: 0 }}
                            viewport={{ once: true }}
                            transition={{ duration: 0.8 }}
                        >
                            <h2 className="text-3xl md:text-5xl font-display font-bold mb-8 leading-tight text-transparent bg-clip-text bg-gradient-to-br from-white via-neutral-200 to-neutral-500">
                                Grazie mille per essere arrivatə fin qui. <br />
                                <span className="text-neutral-500">Aspetto la tua lista con le categorie che preferisci.</span>
                            </h2>
                            
                            <p className="text-xl text-white/80 mb-12 font-light tracking-wide">All'anno prossimo.</p>
                            
                            <div className="inline-block relative">
                                <span className="font-signature text-6xl md:text-7xl text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600 rotate-[-5deg] block">
                                    Salvatore
                                </span>
                            </div>
                        </motion.div>
                    </div>
                    
                    <div className="absolute bottom-0 left-1/2 -translate-x-1/2 w-full h-full max-w-3xl bg-gradient-to-t from-purple-900/10 to-transparent blur-3xl pointer-events-none"></div>
                </footer>
            );
        };

        const App = () => {
            return (
                <main className="w-full">
                    <div className="noise"></div>
                    <div className="ambient-mesh"></div>
                    
                    <Hero />
                    <Section data={YEAR_DATA.movies} />
                    <Section data={YEAR_DATA.series} />
                    <Section data={YEAR_DATA.books} />
                    <MusicSection />
                    <LinksSection />
                    
                    <Footer />
                </main>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
